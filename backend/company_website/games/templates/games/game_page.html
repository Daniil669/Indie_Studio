{% extends 'base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
  <section class="game-detail">
    <h1>{{ object.title }}</h1>
    <img src="{{ object.cover.url }}" alt="{{ object.title }} Cover">
    {% if object.preview_video %}
      <video src="{{ object.preview_video.url }}" controls muted loop playsinline></video>
    {% endif %}
    <p>{{ object.description }}</p>
    <small>Released: {{ object.released|date:"d M Y" }}</small>
  </section>
{% endblock %}
