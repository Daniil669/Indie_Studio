{% extends 'base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
  <section class="tool-detail">
    <h1>{{ object.title }}</h1>
    {% if object.cover %}
      <img src="{{ object.cover.url }}" alt="{{ object.title }} Cover">
    {% endif %}
    <p>{{ object.description }}</p>
    <small>Created: {{ object.created_at|date:"d M Y" }}</small>
  </section>
{% endblock %}
