<div class="game-card">
  <a href="{{ game.get_absolute_url }}">
    <div class="preview">
      <img src="{{ game.cover.url }}" alt="{{ game.title }}" class="poster">
      {% if game.preview_video %}
        <video src="{{ game.preview_video.url }}" muted loop playsinline></video>
      {% endif %}
    </div>
    <h3>{{ game.title }}</h3>
  </a>
</div>
